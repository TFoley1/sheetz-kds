<!-- Modal for Menu -->
<div class="fixed inset-0 z-40 flex items-center justify-center" id="menu-modal">

  <div class="relative grid grid-cols-2 gap-2 text-center text-lg bg-neutral-900 p-4 rounded-lg shadow-xl">
    <div class="w-48 h-18 bg-neutral-400 rounded-md flex items-center justify-center text-3xl cursor-pointer" id="switch-station-btn">Switch Station</div>
    <div class="w-48 h-18 bg-neutral-400 rounded-md flex items-center justify-center text-3xl cursor-pointer" id="add-order-btn">Generate Order</div>
  </div>
</div>

<!-- Modal for Menu -->
<div class="fixed inset-0 z-40 flex items-center justify-center" id="volume-modal">

  <!-- Background Overlay -->

  <!-- Content (When adding new stations update columns)-->
  <div class="relative grid grid-cols-1 gap-2 text-center text-lg bg-neutral-900 p-4 rounded-lg shadow-xl">
    <label class="flex items-center gap-2">
      <span class="text-3xl font-semibold">Vol</span>
      <input
        id="volume-slider"
        type="range"
        min="0"
        max="1"
        step="0.05"
        value="1"
        class="w-48 cursor-pointer accent-mauve-700"
      >
    </label>
  </div>
</div>
